[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-orchestration-benchmark"
version = "0.1.0"
description = "Standardized benchmark suite comparing LLM agent orchestration frameworks on a shared task."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Doeon Kim" }]
keywords = [
    "agents",
    "benchmark",
    "langgraph",
    "crewai",
    "autogen",
    "orchestration",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai==2.54.0",
    "pydantic==2.13.4",
    "typing-extensions==4.16.0",
    "rich==13.9.4",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# Install per-framework extras only when running live benchmarks. CI only
# needs the base dependencies because the mock LLM is built into this package.
langgraph = [
    "langgraph==1.2.11",
    "langchain==1.3.16",
    "langchain-openai==1.6.0",
]
crewai = [
    "crewai==0.203.2",
]
autogen = [
    "pyautogen==0.10.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==5.0.0",
    "ruff==0.16.4",
    "black==26.5.1",
    "mypy==1.20.2",
    # Protect local sdist builds from CVE-2026-59890.
    "setuptools>=83.0.0",
]

[project.urls]
Homepage = "https://github.com/KIM3310/agent-orchestration-benchmark"
Repository = "https://github.com/KIM3310/agent-orchestration-benchmark"
Issues = "https://github.com/KIM3310/agent-orchestration-benchmark/issues"

[project.scripts]
agent-bench = "src.runner:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["results", "fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
